# Keeps HMRC's exchange rates up to date without anyone having to remember.
#
# Every Monday this downloads HMRC's monthly rates. If there are new ones, and
# nothing was lost, and the tests and build still pass, it commits them to main.
# Cloudflare then redeploys the site on its own. HMRC publishes each month's
# rates in the last week or so of the month before, so weekly catches them in time.
#
# If a run fails, GitHub emails you. Nothing is committed when that happens.
# To run it by hand: GitHub -> Actions -> Update HMRC rates -> Run workflow.

name: Update HMRC rates

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download HMRC's rates
        run: npm run update-rates

      - name: Check no rates were lost
        run: node scripts/check-rates-kept.mjs

      - name: See whether anything changed
        id: diff
        run: |
          if git diff --quiet -- src/data/hmrc-monthly-rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build with the new rates
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          latest=$(node -p "require('./src/data/hmrc-monthly-rates.json').to")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hmrc-monthly-rates.json
          git commit -m "Update HMRC rates to $latest"
          git push
